<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REGIONAL SUL</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>body{margin:0;font-family:Arial;background:#0a2a6b}#capa{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(#6cb8e8,#0a2a6b);cursor:pointer}#capa img{width:85vw;max-width:340px;border-radius:28px;background:#fff;padding:10px}.c{background:#fff;padding:15px;border-radius:8px;max-width:500px;margin:20px auto}select,input,button{width:100%;padding:14px;margin:6px 0;border-radius:8px;border:1px solid #ccc}button{border:0;font-weight:bold}</style>
</head>
<body>
<div id="capa" onclick="document.getElementById('capa').style.display='none';document.getElementById('sistema').style.display='block'"><img src="logo.png"><p style="color:#fff;font-weight:bold;margin-top:15px">Toque na figura para entrar</p></div>
<div id="sistema" style="display:none;background:#eee;min-height:100vh;padding:10px"><div class="c" id="l"><h3 style="text-align:center">REGIONAL ENTORNO SUL</h3><p style="text-align:center;color:green;font-size:11px">ONLINE - Permanente</p><select id="u"><option value="">Selecione</option><option value="REGIONAL">REGIONAL</option><option value="AGUAS_LINDAS">Aguas Lindas</option><option value="CIDADE_OCIDENTAL">Cidade Ocidental</option><option value="CRISTALINA">Cristalina</option><option value="NOVO_GAMA">Novo Gama</option><option value="SAD">SAD</option><option value="LUZIANIA">Luziania</option><option value="VALPARAISO">Valparaiso</option><option value="HEAL">HEAL</option><option value="HRL">HRL</option><option value="SVO">SVO</option></select><input id="s" type="password" placeholder="Senha"><button onclick="login()" style="background:#16a34a;color:#fff">ENTRAR</button><p id="msg" style="color:red;text-align:center"></p></div><div id="ok" class="c" style="display:none"><h3 id="nome"></h3><div id="master" style="display:none"><p>NOVO GAMA DNV: <b id="st"></b> <button onclick="tog()">Trocar</button></p><button onclick="limpar()" style="background:#dc2626;color:#fff">LIMPAR TODOS</button><div id="todos"></div></div><div id="unid" style="display:none"><select id="tp"></select><input id="qt" type="number" placeholder="Qtd"><button onclick="pedir()" style="background:#2563eb;color:#fff">SOLICITAR</button><p id="ret"></p><div id="lista"></div></div><button onclick="location.reload()" style="background:#666;color:#fff">Sair</button></div></div>
<script>var cfg={apiKey:"AIzaSyC48OI6Rf8CTmYUM8paEoZ3vUnipSvx7Q4",authDomain:"gestor-regional-sul.firebaseapp.com",databaseURL:"https://gestor-regional-sul-default-rtdb.firebaseio.com",projectId:"gestor-regional-sul",storageBucket:"gestor-regional-sul.firebasestorage.app",messagingSenderId:"590455037718",appId:"1:590455037718:web:9efbf23dee930b06de3a37"};firebase.initializeApp(cfg);var dbRef=firebase.database().ref('fluxo_v2');var db={bloq:true,peds:[]};var SENHAS={REGIONAL:"Ars2026",AGUAS_LINDAS:"AL202601",CIDADE_OCIDENTAL:"CO202602",CRISTALINA:"CR202605",NOVO_GAMA:"NG202604",SAD:"SA202605",LUZIANIA:"LZ202606",VALPARAISO:"VL202607",HEAL:"HA202608",HRL:"HL202609",SVO:"SV202610"};dbRef.on('value',function(s){var v=s.val();if(v){db=v;if(!db.peds)db.peds=[];}if(window.u){if(window.u=="REGIONAL")renderM();else renderU();}});function salvar(){dbRef.set(db);}function login(){var u=document.getElementById('u').value;var s=document.getElementById('s').value.trim();if(SENHAS[u]!==s){document.getElementById('msg').innerHTML="Senha incorreta";return;}window.u=u;document.getElementById('l').style.display='none';document.getElementById('ok').style.display='block';document.getElementById('nome').innerHTML=u;if(u=="REGIONAL"){document.getElementById('master').style.display='block';renderM();}else{document.getElementById('unid').style.display='block';document.getElementById('tp').innerHTML=u=="SVO"?'<option value="DO">DO</option>':'<option value="DO">DO</option><option value="DNV">DNV</option>';renderU();}}function renderU(){var f=db.peds.filter(function(x){return x.u==window.u;});var h="";for(var i=0;i<f.length;i++){var x=f[i];h+='<div>'+x.u+' '+x.q+' '+x.t+' '+(x.q_lib!=null?'LIBERADO '+x.q_lib:'Aguardando')+'</div>';}document.getElementById('lista').innerHTML=h;}function renderM(){document.getElementById('st').innerHTML=db.bloq?"BLOQUEADO":"LIBERADO";var h="";for(var i=0;i<db.peds.length;i++){var x=db.peds[i];h+='<div><b>'+x.u+' '+x.q+' '+x.t+'</b><input id="lib_'+i+'" value="'+(x.q_lib!=null?x.q_lib:x.q)+'"><button onclick="liberar('+i+')">LIBERAR</button></div>';}document.getElementById('todos').innerHTML=h;}function tog(){db.bloq=!db.bloq;salvar();}function pedir(){var t=document.getElementById('tp').value;var q=document.getElementById('qt').value;if(!q)return;db.peds.unshift({u:window.u,t:t,q:q,q_lib:null});salvar();}function liberar(i){var q=document.getElementById('lib_'+i).value;db.peds[i].q_lib=q;salvar();}function limpar(){if(confirm("APAGAR?")){db.peds=[];salvar();}}</script></body></html>
